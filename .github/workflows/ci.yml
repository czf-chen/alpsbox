name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (no FSL needed for these tests)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Byte-compile the package
        run: python -m compileall -q alpsbox
      - name: Release-integrity and citation audit
        run: python tests/test_citations.py
      - name: TOPUP pairing and provenance unit tests
        run: python tests/test_topup_pairing.py
      - name: CLI smoke test (English)
        run: |
          python -m alpsbox --version
          python -m alpsbox --lang en --help
      - name: CLI smoke test (Chinese)
        run: python -m alpsbox --lang zh_CN --help
